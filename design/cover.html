<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>zipcode cover</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#181818; --line:#2C2C2C; --paper:#FFFFFF; --muted:#9E9E9E; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: var(--ink); color: var(--paper); font-family: "Manrope", sans-serif; position: relative; }
  body.square { width: 1080px; height: 1080px; }

  .wrap { position: absolute; inset: 80px 96px; display: flex; flex-direction: column; }
  .mark { font: 700 34px/1 "Manrope"; letter-spacing: -.03em; }
  .mark b { color: var(--muted); font-weight: 700; }
  .kicker { margin-top: auto; font: 500 30px/1.2 "Manrope"; color: var(--muted); }
  h1 { margin-top: 16px; font: 600 88px/1.04 "Manrope"; letter-spacing: -.035em; max-width: 14ch; }
  .num { position: absolute; top: 72px; right: 96px; font: 500 34px/1 "Manrope"; color: var(--muted); letter-spacing: -.02em; }

  /* Аватарка: Telegram обрезает в круг, поэтому всё по центру */
  .logo { display: none; }
  body.square .wrap, body.square .num { display: none; }
  body.square .logo {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font: 700 190px/1 "Manrope"; letter-spacing: -.05em; white-space: nowrap;
  }
  .logo b { color: var(--muted); font-weight: 700; }
</style>
</head>
<body>
<div class="logo"><span>zip<b>code</b></span></div>
<div class="num" id="num"></div>
<div class="wrap">
  <div class="mark">zip<b>code</b></div>
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("title").textContent = q.get("t") || "";
  document.getElementById("kicker").textContent = q.get("k") || "";
  document.getElementById("num").textContent = q.get("n") || "";
  if (q.get("sq")) document.body.classList.add("square");
  document.fonts.load('700 190px "Manrope"');
</script>
</body>
</html>
