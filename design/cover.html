<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>zipcode cover</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --paper:#FFFFFF; --muted:#9E9E9E; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    color: var(--paper);
    font-family: "Manrope", sans-serif;
    /* Свет из угла, как от экрана в тёмной комнате */
    background:
      radial-gradient(900px 620px at 88% 8%, #303030 0%, rgba(48,48,48,0) 70%),
      radial-gradient(700px 500px at 0% 100%, #1A1A1A 0%, rgba(26,26,26,0) 70%),
      #0A0A0A;
  }
  html.square, body.square { width: 1080px; height: 1080px; }

  /* Плёночное зерно поверх всего */
  .grain {
    position: absolute; inset: -50%;
    width: 200%; height: 200%;
    opacity: .14;
    mix-blend-mode: soft-light;
    pointer-events: none;
  }

  /* Огромное слово-призрак, уходит за край кадра */
  .ghost {
    position: absolute;
    right: -30px; bottom: -120px;
    font: 800 480px/1 "Manrope";
    letter-spacing: -.07em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,.16);
    white-space: nowrap;
  }

  .wrap { position: absolute; inset: 80px 96px; display: flex; flex-direction: column; }
  .mark { font: 700 34px/1 "Manrope"; letter-spacing: -.03em; }
  .mark b { color: var(--muted); font-weight: 700; }
  .kicker { margin-top: auto; font: 500 30px/1.2 "Manrope"; color: var(--muted); }
  h1 { margin-top: 16px; font: 600 88px/1.04 "Manrope"; letter-spacing: -.035em; max-width: 14ch; }
  .num { position: absolute; top: 72px; right: 96px; font: 500 34px/1 "Manrope"; color: var(--muted); letter-spacing: -.02em; }

  /* Аватарка: Telegram обрезает в круг, поэтому всё по центру, фон чисто чёрный */
  .logo { display: none; }
  body.square { background: #000000; }
  body.square .grain { display: none; }
  body.square .wrap, body.square .num, body.square .ghost { display: none; }
  body.square .logo {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  }
  .logo .word { font: 700 190px/1 "Manrope"; letter-spacing: -.05em; white-space: nowrap; }
  .logo .word b { color: var(--muted); font-weight: 700; }
  .logo .tag { font: 600 64px/1 "Manrope"; letter-spacing: .01em; color: var(--muted); }
</style>
</head>
<body>
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
<div class="ghost" id="ghost"></div>
<!-- заставляет браузер сразу скачать нужные начертания шрифта -->
<span style="position:absolute;visibility:hidden;font:700 10px Manrope">zip</span><span style="position:absolute;visibility:hidden;font:800 10px Manrope">zip</span>
<div class="logo"><span class="word">zip<b>code</b></span><span class="tag" id="tag"></span></div>
<div class="num" id="num"></div>
<div class="wrap">
  <div class="mark">zip<b>code</b></div>
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("title").textContent = q.get("t") || "";
  document.getElementById("kicker").textContent = q.get("k") || "";
  document.getElementById("num").textContent = q.get("n") || "";
  document.getElementById("ghost").textContent = q.get("g") || q.get("n") || "zip";
  document.getElementById("tag").textContent = q.get("tag") || "";
  if (q.get("sq")) { document.body.classList.add("square"); document.documentElement.classList.add("square"); }
  document.fonts.load('700 190px "Manrope"');
  document.fonts.load('800 440px "Manrope"');
</script>
</body>
</html>
