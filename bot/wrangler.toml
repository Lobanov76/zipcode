name = "zipcode-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Закрытый канал zipcode club: кто в нём состоит — тот оплатил подписку в Tribute
CLUB_CHAT_ID = "-1004330177248"

# База: участники клуба со сроками подписки и счётчики воронки
[[kv_namespaces]]
binding = "ZIP"
id = "45bfb9d55d4c4d2f93f256397c0a8ca6"

# Каждый день в 04:00 UTC = 09:00 по Ташкенту: напоминания о подписках (по понедельникам ещё и статистика)
[triggers]
crons = ["0 4 * * *"]
